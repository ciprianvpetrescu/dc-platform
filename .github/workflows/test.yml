name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  simulation:
    name: converge against the simulation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core pyyaml
          ansible-galaxy collection install community.general ansible.posix

      # Two failure modes are invisible on a warm machine at a fixed path
      # and only appear on a fresh runner: a handler restarting a service
      # the simulation never installed, and any path that assumes where the
      # checkout lives. So the whole run happens from a copy at a
      # different path, converging cold.
      - name: Relocate the checkout
        run: |
          rm -rf /tmp/relocated
          cp -r "$GITHUB_WORKSPACE" /tmp/relocated

      - name: Start the simulation
        working-directory: /tmp/relocated
        run: make sim-reset

      - name: Converge the platform (cold)
        working-directory: /tmp/relocated
        run: make converge

      - name: Converge again (idempotence)
        working-directory: /tmp/relocated
        run: make converge

      - name: Run the test suite
        working-directory: /tmp/relocated
        run: make test

      - name: Tear down
        if: always()
        working-directory: /tmp/relocated
        run: make sim-down

  terraform:
    name: terraform validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive terraform/

      - name: Init and validate
        run: |
          terraform -chdir=terraform init -backend=false
          terraform -chdir=terraform validate
