---
- name: Confirm the host does not already run Proxmox
  ansible.builtin.stat:
    path: /etc/pve/local
  register: pve_present

- name: Install the Proxmox signing key
  ansible.builtin.get_url:
    url: https://enterprise.proxmox.com/debian/proxmox-release-bookworm.gpg
    dest: /etc/apt/trusted.gpg.d/proxmox-release-bookworm.gpg
    mode: "0644"
  when: not pve_present.stat.exists

- name: Add the no-subscription repository
  ansible.builtin.apt_repository:
    repo: "deb http://download.proxmox.com/debian/pve {{ pve_release }} pve-no-subscription"
    filename: pve-no-subscription
    state: present
  when:
    - not pve_present.stat.exists
    - not pve_enterprise_repo

- name: Remove the enterprise repository stub
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/pve-enterprise.list
    state: absent
  when: not pve_enterprise_repo

# In the container simulation the package install cannot complete: pve-manager's
# post-install script writes to /boot and needs a real kernel. The task is
# skipped there and the rest of the role still runs, so the ordering and the
# clustering logic are still exercised. Documented in docs/SIMULATION.md rather
# than worked around, because a test that lies about what it covered is worse
# than no test.
- name: Install Proxmox VE
  ansible.builtin.apt:
    name: [proxmox-ve, postfix, open-iscsi]
    state: present
    update_cache: true
  when:
    - not pve_present.stat.exists
    - not simulate | bool

# Only the first node creates the cluster; the rest join it.
- name: Create the cluster on the first node
  ansible.builtin.command: >-
    pvecm create {{ cluster_name }}
  args:
    creates: /etc/pve/corosync.conf
  when:
    - inventory_hostname == groups['hypervisors'][0]
    - not simulate | bool

- name: Join the remaining nodes to the cluster
  ansible.builtin.command: >-
    pvecm add {{ hostvars[groups['hypervisors'][0]].ansible_host }} --use_ssh
  args:
    creates: /etc/pve/corosync.conf
  when:
    - inventory_hostname != groups['hypervisors'][0]
    - not simulate | bool
