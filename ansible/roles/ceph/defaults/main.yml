---
ceph_release: reef
ceph_public_network: 10.30.0.0/24
ceph_cluster_network: 10.30.0.0/24
ceph_pool_name: vmstore
ceph_pool_pg_num: 128
ceph_pool_pgp_num: 128
ceph_replica_size: 3
ceph_replica_min_size: 2
ceph_osd_devices:
  - /dev/nvme1n1

# See docs/SIMULATION.md - the container simulation cannot create real OSDs.
ceph_packages:
  - ceph
  - ceph-common
  - ceph-mon
  - ceph-osd
  - ceph-mgr

# Packages the container simulation installs. The server daemons need a real
# kernel and are not installed there.
ceph_common_only:
  - ceph-common

simulate: "{{ lookup('env', 'DC_SIMULATE') | default('0', true) | bool }}"
