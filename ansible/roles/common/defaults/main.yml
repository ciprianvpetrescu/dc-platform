---
# Packages every node gets. Kept deliberately small: every extra package is
# patching you own for the life of the platform.
common_packages:
  - chrony          # time sync - Ceph and clustering break on clock drift
  - vim
  - htop
  - curl
  - ca-certificates
  - unattended-upgrades
  - prometheus-node-exporter
  - nvme-cli
  - smartmontools   # disk health - feeds the SMART alerts

common_ntp_servers:
  - 0.ie.pool.ntp.org
  - 1.ie.pool.ntp.org
