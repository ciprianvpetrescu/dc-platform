# Management network only. Ansible never touches the storage VLAN directly.

[hypervisors]
dc-01 ansible_host=10.10.0.11
dc-02 ansible_host=10.10.0.12
dc-03 ansible_host=10.10.0.13

[ceph_mon]
dc-01
dc-02
dc-03

[ceph_mgr]
dc-01

[monitoring]
dc-01

[all:vars]
ansible_user=ansible
ansible_python_interpreter=/usr/bin/python3
# -i rather than IdentityFile: Ansible appends its own -o options after ours,
# and OpenSSH applies them in the order they are parsed - a bare
# 'IdentitiesOnly yes' here would be overridden before the key is named.
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
# Key path for the simulated nodes. ${PWD} is expanded by Ansible's own
# variable interpolation before ssh ever sees it, so this resolves against
# wherever the repo actually is - locally, in a container, or on a CI
# runner. An absolute path would only work on one machine and a relative
# one breaks because ssh resolves it against the working directory.
# Set DC_SSH_KEY to override, e.g. if you point this at real hardware.
ansible_ssh_private_key_file={{ lookup('env', 'DC_SSH_KEY') | default(lookup('env', 'PWD') + '/sim/keys/ansible', true) }}

# Whether these are simulated nodes. Defined here, in [all:vars], rather
# than in a role default: handlers resolve it at the END of a play, by
# which time the role that declared the default may no longer be in
# scope, so a role-scoped default makes handler guards un-evaluatable.
simulate="{{ lookup('env', 'DC_SIMULATE') | default('0', true) | bool }}"

timezone=Europe/Dublin
storage_iface=bond0.30
vm_iface=bond0.20
mgmt_iface=bond0.10
